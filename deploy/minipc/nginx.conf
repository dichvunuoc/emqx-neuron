# Use Compose service names (not container_name). resolver + variables avoid
# stale upstream IPs after `docker compose up` recreates containers.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v2/remote/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $remote_stub_upstream remote-stub;
        proxy_pass http://$remote_stub_upstream:18080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $neuron_upstream neuron;
        proxy_pass http://$neuron_upstream:7000;
    }
}
