[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:neuron]
command=/opt/neuron/neuron --log
directory=/opt/neuron
environment=LD_LIBRARY_PATH="/usr/local/lib",LD_PRELOAD="/usr/local/lib/libopen62541.so"
user=neuron
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:remote-backend]
command=/usr/local/bin/uvicorn app.main:app --app-dir /opt/neuron-remote/backend-stub --host 127.0.0.1 --port 18080
directory=/opt/neuron-remote
user=neuron
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /etc/neuron-remote/nginx.conf -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=QUIT
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
